name: Release Runner Package

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version (e.g. 1.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Clean Runner Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install grpcio-tools protobuf

      - name: Extract Tag or Input Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version_tag }}" ]; then
            VERSION="${{ github.event.inputs.version_tag }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=$(cat workers/VERSION | tr -d '[:space:]')
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and Package Runner
        run: |
          python workers/tools/package_release.py --version "${{ steps.get_version.outputs.VERSION }}"

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.get_version.outputs.VERSION }}"
          name: "Forgity Runner v${{ steps.get_version.outputs.VERSION }}"
          draft: false
          prerelease: false
          files: |
            workers/dist/forgity-runner-*.zip
            workers/dist/forgity-runner-*.zip.sha256
            workers/dist/forgity-runner.zip
            workers/dist/forgity-runner.zip.sha256
          body: |
            ## Forgity Runner Daemon Release
            
            ### Included in this package:
            - Pre-compiled Protobuf stubs (`agent_pb2.py`, `execution_state.py`)
            - Headless Subprocess Runners (Blender, Unreal Engine)
            - Daemon Service Supervisor (`runner service install / start`)
            - Bidirectional gRPC & Isolated RabbitMQ Execution
            - In-place remote auto-update support
            
            ### Verification
            Download the archive and verify the checksum using:
            ```bash
            sha256sum -c forgity-runner-v${{ steps.get_version.outputs.VERSION }}.zip.sha256
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
